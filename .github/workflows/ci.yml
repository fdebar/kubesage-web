name: KubeSage CI

on:
  pull_request:
    branches:
      - main

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      js: ${{ steps.filter.outputs.js }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect changed files
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            js:
              - '**/*.ts'
              - '**/*.tsx'
              - 'package.json'
              - 'tsconfig.json'
              - 'tsconfig.node.json'
              - 'vite.config.ts'
              - 'tests/**'
              - 'src/**'

  build:
    if: needs.changes.outputs.js == 'true'
    needs: changes

    name: Build frontend
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format Check
        run: npm run format:check

      - name: Spellcheck
        run: npm run spellcheck

      - name: Build
        run: npm run build
        env:
          VITE_DATA_SOURCE: demo
          VITE_BASE_PATH: /kubesage-web/
          VITE_BUILD_SHA: ${{ github.sha }}

      - name: Configure SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
