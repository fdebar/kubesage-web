name: KubeSage Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Read package version
        id: package
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Validate version
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Version mismatch."
            echo "package.json: $PACKAGE_VERSION"
            echo "Requested release: $RELEASE_VERSION"
            exit 1
          fi

      - name: Check tag does not already exist
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse "v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Tag v$RELEASE_VERSION already exists."
            exit 1
          fi

      - name: Create tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git tag -a "v$RELEASE_VERSION" -m "KubeSage Web v$RELEASE_VERSION"
          git push origin "v$RELEASE_VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$RELEASE_VERSION" \
            --title "KubeSage Web v$RELEASE_VERSION" \
            --generate-notes
